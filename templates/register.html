{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-lg cyber-card">
      <div class="card-body p-4">
        <h5 class="card-title text-center mb-1 text-success">Create Account</h5>
        <p class="text-light text-center small mb-4">Register your SecureVault account.</p>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label text-light">Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Confirm Password</label>
            <input type="password" name="confirm" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Register</button>
        </form>
        <p class="mt-3 mb-0 text-center small text-light">
          Already have an account?
          <a href="{{ url_for('login') }}" class="link-success">Login here</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
