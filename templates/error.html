{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-lg cyber-card border-danger">
      <div class="card-body p-4">
        <h5 class="card-title text-danger mb-3">{{ title }}</h5>
        <p class="mb-3">{{ message }}</p>
        <a href="{{ url_for('dashboard') if current_user else url_for('login') }}"
           class="btn btn-outline-light">Back</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
