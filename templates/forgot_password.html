{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-lg cyber-card">
      <div class="card-body p-4">
        <h5 class="card-title text-center mb-1 text-success">Reset Password</h5>
        <p class="text-light text-center small mb-3">Recover account without email using mobile + Authenticator code.</p>
        <form method="post" novalidate autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label text-light">Username</label>
            <input type="text" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Registered Mobile Number</label>
            <input type="text" name="mobile" class="form-control" inputmode="numeric" pattern="[0-9]*" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Authenticator Code</label>
            <input type="text" name="totp_code" class="form-control" inputmode="numeric" pattern="[0-9]*" maxlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-light">New Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Confirm Password</label>
            <input type="password" name="confirm" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Reset Password</button>
        </form>
        <p class="mt-3 mb-0 text-center small text-light">
          Remembered your password?
          <a href="{{ url_for('login') }}" class="link-success">Login here</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
